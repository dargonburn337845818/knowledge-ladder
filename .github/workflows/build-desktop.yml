name: Build Desktop EXE

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name KnowledgeLadder --collect-all PySide6 --add-data "style.qss;." --add-data "algorithm_prior.json;." --add-data "feature_algorithm_matrix.json;." --add-data "heuristics.json;." --add-data "teacher_consensus.json;." main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeLadder-Windows-EXE
          path: dist/KnowledgeLadder.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: KnowledgeLadder-Windows-EXE
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KnowledgeLadder.exe
          body_path: RELEASE_NOTES.md
