name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint Python
        run: |
          ruff check .

      - name: Type-check pure logic
        run: |
          mypy --ignore-missing-imports entropy_engine.py info_framework.py knowledge_data.py tiers_data.py export_mobile_data.py app/teacher_consensus.py app/direction_content.py

      - name: Compile Python sources
        run: |
          python -m py_compile main.py app/*.py entropy_engine.py info_framework.py knowledge_data.py tiers_data.py export_mobile_data.py

      - name: Check data schema and versions
        run: |
          python scripts/check_data_schema.py

      - name: Validate teaching content
        run: |
          python scripts/validate_content.py

      - name: Agent guidance proxy experiment
        run: |
          python scripts/agent_experiment.py

      - name: Regenerate mobile data
        run: |
          python export_mobile_data.py
          test -f mobile/www/entropy_data.js
          git diff --exit-code -- mobile/www/entropy_data.js

      - name: Check mobile JS syntax
        run: |
          node --check mobile/www/entropy_engine.js
          node --check mobile/www/app.js
          node --check mobile/www/card_store.js
          node --check mobile/www/sw.js

      - name: Card store & app flow Node tests
        run: |
          node tests/test_card_store.js
          node tests/test_app_flow.js

      - name: Engine parity (Python vs JS)
        run: |
          python scripts/engine_parity.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v

  # 独立 desktop-test job：PySide6 的 offscreen 测试需要系统 Qt 依赖，
  # 单独隔离可避免纯 Python 检查被 GUI 环境问题污染；同时让被跳过的 UI/state 测试真正成为门禁。
  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libgl1 libxcb-cursor0

      - name: Install PySide6
        run: |
          pip install "PySide6>=6.6"

      - name: Desktop/state tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_state tests.test_dissect_smoke tests.test_dissect_flow -v
