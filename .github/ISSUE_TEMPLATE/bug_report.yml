name: Bug report
description: Report a reproducible problem with Knowledge Ladder
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows desktop
        - Android APK
        - Mobile PWA / browser
        - Linux / other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Please confirm you did not include private data.
      options:
        - label: I have NOT included credentials, local paths, or personal data.
          required: true
