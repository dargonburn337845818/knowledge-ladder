[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ladder"
version = "1.15.0"
description = "Local-first entropy-based competitive programming dissection tool (PySide6 desktop + PWA/Capacitor mobile)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[tool.setuptools]
py-modules = [
    "main",
    "entropy_engine",
    "info_framework",
    "knowledge_data",
    "tiers_data",
    "export_mobile_data",
    "resource_paths",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.qss"]

[tool.setuptools.data-files]
"." = [
    "algorithm_prior.json",
    "feature_algorithm_matrix.json",
    "heuristics.json",
    "teacher_consensus.json",
    "style.qss",
]
"expert_content" = ["expert_content/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
