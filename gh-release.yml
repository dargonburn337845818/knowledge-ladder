# 由 gh-automation/scripts/install-repo-config.py 生成；改这里而不是改脚本。
# 说明：ghp.py 读取本文件；字段含义见 gh-automation/templates/release.yml。
repo: knowledge-ladder
default_branch: main
version_source: pyproject.toml#version
build: python3 -m pip install -r requirements.txt && python3 -m compileall -q app
  main.py
artifacts:
- main.py
checks:
- privacy
- style
ci_required: false
release:
  enabled: true
  tag_prefix: v
allow_dirty: false
timeout_seconds: 300
retries: 2
local_dir: knowledge-ladder-repo
