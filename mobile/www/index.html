<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#141519">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>拆题</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>拆题</span>
      </div>
    </header>

    <main id="dissect-view" class="view active">
      <div id="homeProgress" class="progress-line"></div>

      <div class="section-title">四种信息操作</div>
      <div id="opOverview" class="op-grid"></div>

      <div class="section-title">拆题四步</div>
      <p class="guide-note">点选四步，马上出方向。</p>
      <div id="dissectWizard"></div>
      <div id="dissectResult" class="result-card hidden"></div>

      <div class="section-title">n 规模速查</div>
      <div id="nScaleCard" class="nscale-card"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
