<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F0E6">
  <title>拆题引导</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-editorial">
  <div id="app">
    <header class="top">
      <div class="step-count" id="stepCount">开始</div>
    </header>

    <main id="stage" class="stage"></main>

    <div id="explainModal" class="explain-modal hidden">
      <div class="explain-mask" id="explainMask"></div>
      <div class="explain-sheet">
        <div class="explain-head">
          <div id="explainTitle" class="explain-title"></div>
          <button id="explainClose" class="close-btn">×</button>
        </div>
        <div id="explainBody" class="explain-body"></div>
      </div>
    </div>
  </div>

  <script src="entropy_data.js"></script>
  <script src="entropy_engine.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
